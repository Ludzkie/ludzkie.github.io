<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05020a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .message-container {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 2s ease, transform 2s ease;
            pointer-events: none;
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            color: #ff758c;
            font-size: clamp(2.5rem, 5vw, 5rem);
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.6), 0 0 40px rgba(255, 117, 140, 0.4);
            letter-spacing: 2px;
        }

        p {
            color: #ffeb3b;
            font-size: clamp(1rem, 2vw, 1.5rem);
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }
    </style>
</head>
<body>

    <div class="message-container" id="messageContainer">
        <h1>Happy Birthday!</h1>
        <p>Wishing you a day as bright and beautiful as this bloom.</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let progress = 0;
        let animationFinished = false;

        // Particle system for celebration sparkles
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4 - 1;
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, 75%)`;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 100;

            // Phase 1: Grow Stem
            if (progress < 1) {
                progress += 0.008;
            } else {
                if (!animationFinished) {
                    animationFinished = true;
                    document.getElementById('messageContainer').classList.add('visible');
                }
            }

            const currentProgress = Math.min(progress, 1);

            // Draw Stem
            const stemHeight = 250 * currentProgress;
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX, canvas.height);
            ctx.quadraticCurveTo(centerX - 20, canvas.height - stemHeight / 2, centerX, canvas.height - stemHeight);
            ctx.stroke();

            // Draw Leaves
            if (currentProgress > 0.4) {
                let leafProgress = (currentProgress - 0.4) / 0.6;
                ctx.fillStyle = '#66bb6a';
                
                // Left leaf
                ctx.save();
                ctx.translate(centerX - 5, canvas.height - stemHeight * 0.5);
                ctx.rotate(-Math.PI / 4);
                ctx.scale(leafProgress, leafProgress);
                ctx.beginPath();
                ctx.ellipse(30, 0, 40, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Right leaf
                ctx.save();
                ctx.translate(centerX + 5, canvas.height - stemHeight * 0.7);
                ctx.rotate(Math.PI / 4);
                ctx.scale(leafProgress, leafProgress);
                ctx.beginPath();
                ctx.ellipse(30, 0, 40, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Flower Bloom at the top of the stem
            const flowerX = centerX;
            const flowerY = canvas.height - stemHeight;

            if (currentProgress > 0.5) {
                let bloomProgress = (currentProgress - 0.5) / 0.5;
                // Ease out elastic effect for blooming petals
                let easeBloom = Math.sin(bloomProgress * Math.PI / 2);

                const petallayers = 3;
                const petalsCount = 10;

                for (let layer = petallayers; layer >= 1; layer--) {
                    let scale = easeBloom * (1.2 - layer * 0.15);
                    let angleStep = (Math.PI * 2) / petalsCount;

                    ctx.save();
                    ctx.translate(flowerX, flowerY);

                    for (let i = 0; i < petalsCount; i++) {
                        ctx.save();
                        ctx.rotate(i * angleStep + (layer * 0.2));
                        ctx.scale(scale, scale);

                        let gradient = ctx.createRadialGradient(0, -50, 5, 0, -50, 60);
                        if (layer === 1) {
                            gradient.addColorStop(0, '#ffeb3b');
                            gradient.addColorStop(1, '#ff9800');
                        } else if (layer === 2) {
                            gradient.addColorStop(0, '#ff4081');
                            gradient.addColorStop(1, '#c51162');
                        } else {
                            gradient.addColorStop(0, '#ff80ab');
                            gradient.addColorStop(1, '#ad1457');
                        }

                        ctx.fillStyle = gradient;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#ff4081';

                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(-35, -40, -35, -100, 0, -130);
                        ctx.bezierCurveTo(35, -100, 35, -40, 0, 0);
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.restore();
                }

                // Center flower core
                ctx.save();
                ctx.translate(flowerX, flowerY);
                ctx.scale(easeBloom, easeBloom);
                let coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
                coreGrad.addColorStop(0, '#ffeb3b');
                coreGrad.addColorStop(1, '#ff5722');
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Generate celebration sparkles after bloom
                if (animationFinished && Math.random() < 0.4) {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = Math.random() * 120;
                    particles.push(new Particle(flowerX + Math.cos(angle) * dist, flowerY + Math.sin(angle) * dist));
                }
            }

            // Update and render particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Start animation loop after a short pause
        setTimeout(animate, 500);
    </script>
</body>
</html>
