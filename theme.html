<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Themes - Quarter 3 Notes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <a href="menu.html" class="btn-back">&larr; Back to Menu</a>

    <div class="badge">Quarter 3 &bull; Appearance</div>
    <h1>Choose Your Color Theme</h1>
    <p class="subtitle">Pick from 20 preset themes. Your choice saves on this device across all reviewer pages.</p>

    <div class="theme-page-grid">
        <button type="button" class="swatch-option" data-theme="cyber" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#00f5d4"></i><i style="background:#38bdf8"></i><i style="background:#a855f7"></i></span>
            <span class="swatch-name">01. Cyber Neon</span>
        </button>

        <button type="button" class="swatch-option" data-theme="sunset" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#fb923c"></i><i style="background:#facc15"></i><i style="background:#f43f5e"></i></span>
            <span class="swatch-name">02. Sunset Pulse</span>
        </button>

        <button type="button" class="swatch-option" data-theme="emerald" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#10b981"></i><i style="background:#38bdf8"></i><i style="background:#a3e635"></i></span>
            <span class="swatch-name">03. Emerald Mint</span>
        </button>

        <button type="button" class="swatch-option" data-theme="royal" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#c084fc"></i><i style="background:#818cf8"></i><i style="background:#e879f9"></i></span>
            <span class="swatch-name">04. Royal Violet</span>
        </button>

        <button type="button" class="swatch-option" data-theme="solar" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#facc15"></i><i style="background:#38bdf8"></i><i style="background:#fb7185"></i></span>
            <span class="swatch-name">05. Solar Gold</span>
        </button>

        <button type="button" class="swatch-option" data-theme="berry" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#ec4899"></i><i style="background:#c084fc"></i><i style="background:#2dd4bf"></i></span>
            <span class="swatch-name">06. Berry Pop</span>
        </button>

        <button type="button" class="swatch-option" data-theme="ocean" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#0ea5e9"></i><i style="background:#22d3ee"></i><i style="background:#6366f1"></i></span>
            <span class="swatch-name">07. Deep Ocean</span>
        </button>

        <button type="button" class="swatch-option" data-theme="crimson" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#f43f5e"></i><i style="background:#fb7185"></i><i style="background:#f59e0b"></i></span>
            <span class="swatch-name">08. Crimson Blaze</span>
        </button>

        <button type="button" class="swatch-option" data-theme="lime" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#84cc16"></i><i style="background:#22c55e"></i><i style="background:#06b6d4"></i></span>
            <span class="swatch-name">09. Acid Lime</span>
        </button>

        <button type="button" class="swatch-option" data-theme="lavender" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#a78bfa"></i><i style="background:#f472b6"></i><i style="background:#60a5fa"></i></span>
            <span class="swatch-name">10. Dream Lavender</span>
        </button>

        <button type="button" class="swatch-option" data-theme="coral" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#ff6b6b"></i><i style="background:#ffa06b"></i><i style="background:#ffd93d"></i></span>
            <span class="swatch-name">11. Coral Reef</span>
        </button>

        <button type="button" class="swatch-option" data-theme="ice" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#67e8f9"></i><i style="background:#93c5fd"></i><i style="background:#c4b5fd"></i></span>
            <span class="swatch-name">12. Arctic Ice</span>
        </button>

        <button type="button" class="swatch-option" data-theme="magma" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#ef4444"></i><i style="background:#f97316"></i><i style="background:#eab308"></i></span>
            <span class="swatch-name">13. Magma Core</span>
        </button>

        <button type="button" class="swatch-option" data-theme="mint" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#34d399"></i><i style="background:#2dd4bf"></i><i style="background:#a7f3d0"></i></span>
            <span class="swatch-name">14. Frost Mint</span>
        </button>

        <button type="button" class="swatch-option" data-theme="grape" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#d946ef"></i><i style="background:#8b5cf6"></i><i style="background:#3b82f6"></i></span>
            <span class="swatch-name">15. Neon Grape</span>
        </button>

        <button type="button" class="swatch-option" data-theme="amber" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#f59e0b"></i><i style="background:#fbbf24"></i><i style="background:#ea580c"></i></span>
            <span class="swatch-name">16. Golden Amber</span>
        </button>

        <button type="button" class="swatch-option" data-theme="teal" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#14b8a6"></i><i style="background:#06b6d4"></i><i style="background:#818cf8"></i></span>
            <span class="swatch-name">17. Tropic Teal</span>
        </button>

        <button type="button" class="swatch-option" data-theme="sakura" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#f472b6"></i><i style="background:#fda4af"></i><i style="background:#c084fc"></i></span>
            <span class="swatch-name">18. Sakura Dusk</span>
        </button>

        <button type="button" class="swatch-option" data-theme="cobalt" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#3b82f6"></i><i style="background:#00f5d4"></i><i style="background:#a855f7"></i></span>
            <span class="swatch-name">19. Cobalt Surge</span>
        </button>

        <button type="button" class="swatch-option" data-theme="aurora" aria-pressed="false">
            <span class="swatch-dots"><i style="background:#2dd4bf"></i><i style="background:#a855f7"></i><i style="background:#4ade80"></i></span>
            <span class="swatch-name">20. Northern Aurora</span>
        </button>
    </div>

    <footer>
        Shared Class Reviewer &bull; Quarter 3
    </footer>
</div>

<script src="theme.js"></script>
</body>
</html>
